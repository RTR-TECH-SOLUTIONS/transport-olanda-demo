name: Publică site-ul

# Un push pe main construiește site-ul de două ori: varianta de producție ajunge
# în branch-ul `productie`, de unde Hostinger o ia singur prin Git, iar demo-ul
# rămâne pe GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicare
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Construiește varianta de producție
        run: npm run build

      - name: Publică în branch-ul productie
        run: |
          set -e
          cd dist
          git init -q -b productie
          git config user.name "RTR Solutions (automat)"
          git config user.email "contact@rtrsolutions.ro"
          git add -A
          git commit -q -m "Site construit din $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" productie
          rm -rf .git

      - name: Construiește demo-ul pentru GitHub Pages
        run: npm run build
        env:
          DEMO: 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  demo:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
